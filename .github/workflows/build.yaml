---
name: metal-stack component release

on:
  pull_request:
    branches:
      - master
  release:
    types:
      - published
  push:
    branches:
      - master

jobs:
  draft:
    uses: metal-stack/actions-common/.github/workflows/release-drafter.yaml@v1

  go-build:
    uses: metal-stack/actions-common/.github/workflows/go-build.yaml@v1
    secrets: inherit
    with:
      build-command: make build
      test-command: make test

  integration_matrix:
    name: Integration Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: providers
            pattern: Test_BackupProvider
          - name: etcd
            pattern: Test_ETCD
          - name: keydb
            pattern: Test_KeyDB
          - name: localfs
            pattern: Test_Localfs
          - name: postgres
            pattern: Test_Postgres
          - name: redis
            pattern: Test_Redis
          - name: rethinkdb
            pattern: Test_RethinkDB
          - name: valkey
            pattern: Test_Valkey

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'
        cache: false

    - name: Create k8s Kind Cluster
      uses: helm/kind-action@v1.14.0
      with:
        install_only: true

    - name: Test
      env:
        GO_RUN: ${{ matrix.pattern }}
      run: |
        make test-integration

  integration:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [integration_matrix]
    if: always()
    steps:
      - name: Matrix jobs passed
        if: ${{ needs.integration_matrix.result == 'success' }}
        run: exit 0
      - name: Fail if matrix jobs did not succeed
        if: ${{ needs.integration_matrix.result != 'success' }}
        run: exit 1
